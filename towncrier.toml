[tool.towncrier]
name = "MoneyBin"
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] — {project_date}"
issue_format = "[#{issue}](https://github.com/bsaffel/moneybin/pull/{issue})"
issue_pattern = '^(\d+|\+[a-z0-9][a-z0-9-]*)$'
ignore = []

[[tool.towncrier.type]]
name = "Added"
[[tool.towncrier.type]]
name = "Changed"
[[tool.towncrier.type]]
name = "Deprecated"
[[tool.towncrier.type]]
name = "Removed"
[[tool.towncrier.type]]
name = "Fixed"
[[tool.towncrier.type]]
name = "Security"
