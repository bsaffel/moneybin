name: Privacy performance

# Shared-runner wall-clock noise makes these budgets unsuitable for PR gating.
# Keep the benchmark available on demand with its original thresholds.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privacy-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-privacy-performance:
    name: Privacy performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run privacy performance budgets
        env:
          # The persona fixture creates an encrypted database before measuring.
          # CI runners do not have a keyring backend, so use an ephemeral key.
          MONEYBIN_PROFILE__SCENARIO__DATABASE__ENCRYPTION_KEY: ci-ephemeral-key-runner-destroyed-after-job
        run: >-
          uv run pytest tests/scenarios/test_privacy_middleware_perf.py -m perf -n 0 -v
          -o log_cli=true --log-cli-level=INFO
