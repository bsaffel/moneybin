name: CI

on:
  workflow_call:
    inputs:
      record_durations:
        description: Record pytest durations instead of running the normal CI jobs
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      record_durations:
        description: Record pytest durations instead of running the normal CI jobs
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 6"
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so rapid pushes (common with agents)
# don't pile up behind stale runs. Mirrors scenarios.yml.
concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.record_durations }}
  cancel-in-progress: true

jobs:
  # Detect whether any non-docs files changed. For pushes to main we always
  # run the full suite; for PRs we skip code jobs when only docs changed.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for non-docs changes
        id: check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            CHANGED=$(git diff --name-only "origin/$BASE_REF" HEAD)
            echo "Changed files:"
            echo "$CHANGED"
            if echo "$CHANGED" | grep -qvE '^(docs/|CHANGELOG\.md|README\.md)'; then
              echo "code=true" >> $GITHUB_OUTPUT
            else
              echo "code=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "code=true" >> $GITHUB_OUTPUT
          fi

  checks:
    name: Checks
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && github.event_name != 'schedule' && !inputs.record_durations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

  # Docs-only PRs skip every code job above. The unit suite is what reads
  # the docs (the policy guards, the MCP-surface prose checks, the
  # spec-status tests), so run it once, unsharded, on exactly those PRs.
  # Pushes to main and code PRs cover it through the sharded test-unit job.
  test-unit-docs-only:
    name: Unit tests (docs-only PR)
    needs: [changes]
    if: needs.changes.outputs.code == 'false' && github.event_name == 'pull_request' && !inputs.record_durations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install DuckDB CLI
        run: |
          curl -fsSL https://install.duckdb.org | bash
          echo "$HOME/.duckdb/cli/latest" >> $GITHUB_PATH

      - name: Test
        run: uv run pytest tests/ -m unit -n logical

  # Test jobs select by marker across the whole tests/ tree, not by
  # directory. Every test ends up with exactly one of
  # {unit, integration, e2e, scenarios} — the root conftest auto-applies
  # `unit` when no category marker is present and errors on conflicts,
  # so each job can use a plain `-m <category>` selection.
  test-unit:
    name: Unit tests (shard ${{ matrix.group }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && github.event_name != 'schedule' && !inputs.record_durations
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel sibling shards on one failure — surface every failing
      # test across the suite in a single run, not just the first shard's.
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install DuckDB CLI
        run: |
          curl -fsSL https://install.duckdb.org | bash
          echo "$HOME/.duckdb/cli/latest" >> $GITHUB_PATH

      - name: Restore CI test durations
        uses: actions/cache/restore@v4
        with:
          path: .test_durations
          key: ci-test-durations-v1-${{ github.run_id }}
          restore-keys: ci-test-durations-v1-

      # pytest-split shards the unit suite across the matrix so wall-clock
      # scales with the number of free standard runners. strategy.job-total is
      # the matrix size, so --splits stays in lockstep with the `group` array.
      # Each shard writes its own coverage data file; the `coverage` job below
      # combines them into a single report.
      - name: Test
        env:
          COVERAGE_FILE: .coverage.${{ matrix.group }}
          # sys.monitoring-based coverage (PEP 669) on Python 3.12 — far lower
          # tracing overhead than the default C tracer. Needs coverage >= 7.4.
          COVERAGE_CORE: sysmon
        run: |
          uv run pytest tests/ -m unit -v -n logical \
            --splits ${{ strategy.job-total }} --group ${{ matrix.group }} \
            --cov=src --cov-report= --durations=25

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-data-${{ matrix.group }}
          path: .coverage.${{ matrix.group }}
          include-hidden-files: true

  # Combine the per-shard coverage data into one report. Runs even when a
  # shard failed, so partial coverage still lands; waits on every shard.
  coverage:
    name: Coverage report
    needs: [changes, test-unit]
    if: ${{ always() && needs.changes.outputs.code == 'true' && github.event_name != 'schedule' && !inputs.record_durations }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine and report
        run: |
          uv run coverage combine
          uv run coverage xml
          uv run coverage report

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.xml

  # Build the wheel, install it into a venv with no repo on sys.path, and run
  # the real user path from outside the checkout. Every other job runs inside
  # the repo against the locked dependency set, so none of them can see a wheel
  # that ships no schema/migrations/models — or a published dependency range
  # that resolves to a broken version. The script is shared with the release
  # workflow so the release matrix cannot drift from this guard.
  smoke-install:
    name: Clean-install smoke test
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && github.event_name != 'schedule' && !inputs.record_durations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: Smoke-test the installed wheel
        env:
          WORK_DIR: ${{ runner.temp }}/smoke
        run: ./scripts/smoke_install.sh dist

  test-integration:
    name: Integration tests (shard ${{ matrix.group }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && github.event_name != 'schedule' && !inputs.record_durations
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install DuckDB CLI
        run: |
          curl -fsSL https://install.duckdb.org | bash
          echo "$HOME/.duckdb/cli/latest" >> $GITHUB_PATH

      - name: Restore CI test durations
        uses: actions/cache/restore@v4
        with:
          path: .test_durations
          key: ci-test-durations-v1-${{ github.run_id }}
          restore-keys: ci-test-durations-v1-

      # Shard the integration suite with pytest-split, same pattern as test-unit
      # and test-e2e. This was the workflow's critical path at ~12.5 min — more
      # than double any other job — so it, not Scenarios, set overall PR time.
      # 4-way brings it under the ~5 min Scenarios floor.
      #
      # One integration shard can still run long when its loadscope group is
      # dominated by an expensive module. Combined with
      # --dist=loadscope pinning a module to one worker, a shard that lands
      # dominated by one expensive module (test_demo_service.py,
      # test_stg_plaid_investments.py) can't parallelize out of it.
      - name: Test
        run: |
          uv run pytest tests/ -m integration -v -n logical \
            --splits ${{ strategy.job-total }} --group ${{ matrix.group }} \
            --durations=25

  test-e2e:
    name: E2E tests (shard ${{ matrix.group }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && github.event_name != 'schedule' && !inputs.record_durations
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install DuckDB CLI
        run: |
          curl -fsSL https://install.duckdb.org | bash
          echo "$HOME/.duckdb/cli/latest" >> $GITHUB_PATH

      - name: Restore CI test durations
        uses: actions/cache/restore@v4
        with:
          path: .test_durations
          key: ci-test-durations-v1-${{ github.run_id }}
          restore-keys: ci-test-durations-v1-

      # Shard the e2e suite with pytest-split, same pattern as test-unit.
      # 4-way took the worst e2e shard from 437s to 251s (measured, #396) --
      # this suite splits well because its tests spread over many classes, so
      # no shard ends up pinned to one loadscope group. Widening further keeps
      # helping in theory; it also adds runners, and CI + Scenarios + AI review
      # already dispatch 20 concurrent jobs (observed starting without
      # queueing, so the real ceiling is at least that -- it has not been
      # measured). No coverage here, so no combine job.
      - name: Test
        run: |
          uv run pytest tests/ -m e2e -v -n logical \
            --splits ${{ strategy.job-total }} --group ${{ matrix.group }} \
            --durations=25

  record-test-durations:
    name: Record CI test durations
    needs: [changes]
    if: github.event_name == 'schedule' || inputs.record_durations
    runs-on: ubuntu-latest
    concurrency:
      group: ci-duration-recording-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install DuckDB CLI
        run: |
          curl -fsSL https://install.duckdb.org | bash
          echo "$HOME/.duckdb/cli/latest" >> $GITHUB_PATH

      - name: Record durations on the CI runner
        env:
          MONEYBIN_DATABASE__ENCRYPTION_KEY: ci-ephemeral-key-runner-destroyed-after-job
        run: |
          uv run pytest tests/ -m "unit or integration or e2e or scenarios" \
            -n logical --store-durations

      - name: Save CI test durations
        uses: actions/cache/save@v4
        with:
          path: .test_durations
          key: ci-test-durations-v1-${{ github.run_id }}
