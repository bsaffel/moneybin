name: Scenarios

on:
  workflow_call:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: scenarios-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  run-scenarios:
    name: Run Scenarios (shard ${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 4-way pytest-split shard, matching ci.yml's unit and integration
    # matrices; `--splits` reads strategy.job-total, so it tracks this array.
    # Balancing uses the CI-recorded `.test_durations` cache rather than test
    # count, so the shards hold uneven counts by design. Four rather than two
    # because
    # runner speed varies about 1.8x on identical work — shard 1 ran the same
    # 36 items in 320s and then 574s — and a 2-way split left only ~1.9x
    # headroom under timeout-minutes, thin enough that one slow runner
    # cancelled a shard mid-suite. Keep nominal per-shard runtime well under
    # half the ceiling.
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Restore CI test durations
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .test_durations
          key: ci-test-durations-v1-${{ github.run_id }}
          restore-keys: ci-test-durations-v1-

      - name: Run scenario suite
        env:
          # GitHub Actions runners have no keyring backend; SecretStore
          # falls through to this env var for the encryption key. The
          # value is ephemeral — the runner is destroyed after each job.
          MONEYBIN_DATABASE__ENCRYPTION_KEY: ci-ephemeral-key-runner-destroyed-after-job
        run: |
          set -o pipefail
          uv run pytest tests/ -m "scenarios and not perf" -v \
            --splits ${{ strategy.job-total }} --group ${{ matrix.group }} \
            --json-report --json-report-file=scenarios-${{ matrix.group }}.json \
            --durations=25

      - name: Per-scenario summary
        if: always()
        run: |
          echo "## Scenario results (shard ${{ matrix.group }})" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.tests[] | "- \(.nodeid | split("::") | last): \(.outcome | ascii_upcase) (\(((.setup.duration // 0) + (.call.duration // 0) + (.teardown.duration // 0)) | floor)s)"' \
            scenarios-${{ matrix.group }}.json >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scenarios-results-${{ matrix.group }}
          path: scenarios-${{ matrix.group }}.json
