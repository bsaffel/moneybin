name: Scenarios

on:
  workflow_call:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: scenarios-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  run-scenarios:
    name: Run Scenarios (shard ${{ matrix.group }})
    runs-on: ubuntu-latest
    # Observed progress projects about 12 minutes for classification-heavy shards;
    # leave setup/reporting headroom without changing individual test timeouts.
    timeout-minutes: 15
    # Four duration-balanced shards; strategy.job-total keeps --splits in sync.
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Restore CI test durations
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .test_durations
          key: ci-test-durations-v1-${{ github.run_id }}
          restore-keys: ci-test-durations-v1-

      # New expensive cases lack cached timings; spread them across shards too.
      - name: Run scenario suite
        env:
          # GitHub Actions runners have no keyring backend; SecretStore
          # falls through to this env var for the encryption key. The
          # value is ephemeral — the runner is destroyed after each job.
          MONEYBIN_PROFILE__SCENARIO__DATABASE__ENCRYPTION_KEY: ci-ephemeral-key-runner-destroyed-after-job
        run: |
          set -o pipefail
          uv run pytest tests/ -m "scenarios and not perf" -vv --dist=load \
            --splits ${{ strategy.job-total }} --group ${{ matrix.group }} \
            --splitting-algorithm=least_duration \
            --json-report --json-report-file=scenarios-${{ matrix.group }}.json \
            --durations=25

      - name: Per-scenario summary
        if: always()
        run: |
          echo "## Scenario results (shard ${{ matrix.group }})" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.tests[] | "- \(.nodeid | split("::") | last): \(.outcome | ascii_upcase) (\(((.setup.duration // 0) + (.call.duration // 0) + (.teardown.duration // 0)) | floor)s)"' \
            scenarios-${{ matrix.group }}.json >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenarios-results-${{ matrix.group }}
          path: scenarios-${{ matrix.group }}.json
