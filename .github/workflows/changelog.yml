name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  fragments:
    name: Changelog fragments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Validate fragments and release scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The event payload's labels are a snapshot taken when the event
          # fired. Dependabot labels a PR a second or two after opening it, so
          # the `opened` run saw no skip-changelog label and failed while the
          # `labeled` runs passed, and every Actions bump still showed a red
          # check (#671, #672). Read the labels as they are now instead. That
          # narrows the window rather than closing it: a label applied after
          # this lookup still fails this run, and the `labeled` event's re-run
          # is the one that passes.
          if ! LABELS="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.labels[].name')"; then
            echo "Could not read the labels of PR #${PR_NUMBER}, so skip-changelog and release-preparation cannot be evaluated. Re-run this job." >&2
            exit 1
          fi
          SKIP_CHANGELOG=false
          RELEASE_PREPARATION=false
          if grep -qx 'skip-changelog' <<< "$LABELS"; then
            SKIP_CHANGELOG=true
          fi
          if grep -qx 'release-preparation' <<< "$LABELS"; then
            RELEASE_PREPARATION=true
          fi
          # actions/checkout builds the ephemeral GitHub merge commit for
          # pull_request events: HEAD^1 is the base branch's current tip and
          # HEAD^2 is the PR head. github.event.pull_request.base.sha is only
          # the base at last sync and can lag main, so diffing against it
          # blames the PR for base-branch commits made in between (#603).
          # Fail loudly instead of silently falling back if that assumption
          # ever stops holding (e.g. checkout switches to the PR head ref).
          MERGE_HEAD_SHA="$(git rev-parse HEAD^2)"
          if [ "$MERGE_HEAD_SHA" != "$PR_HEAD_SHA" ]; then
            echo "HEAD^2 ($MERGE_HEAD_SHA) does not match the PR head ($PR_HEAD_SHA)." >&2
            echo "Expected actions/checkout to have checked out GitHub's merge-ref commit for this pull_request event." >&2
            exit 1
          fi
          BASE_SHA="$(git rev-parse HEAD^1)"
          if [ "$RELEASE_PREPARATION" != "true" ]; then
            if ! git diff --quiet "$BASE_SHA...HEAD" -- CHANGELOG.md; then
              echo 'CHANGELOG.md is assembled only in a release-preparation PR. Add a changelog.d fragment instead.'
              exit 1
            fi
          fi
          uv run --locked towncrier build --draft --version validation
          if [ "$SKIP_CHANGELOG" != "true" ] && [ "$RELEASE_PREPARATION" != "true" ]; then
            uv run --locked towncrier check --compare-with "$BASE_SHA"
          fi
