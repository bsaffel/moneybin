# Every amount below is denominated in its own account's currency. Two explicit
# USD/EUR transfers provide executed conversion terms; no rate is inferred. AED
# is deliberately outside Frankfurter's 30-currency set, so the UAE account
# exercises the unpriced-pair path that a wholly ECB-covered persona would never
# reach. The non-USD accounts span both source types on purpose: OFX and tabular
# write currency to different tables, so a persona weighted to one would leave
# the other's threading unproven.
persona: international
profile: eve
description: "Multi-bank across countries, five currencies, ~690 txns/yr"
years_default: 2

accounts:
  - name: "Eurozone Checking"
    type: checking
    source_type: ofx
    institution: "ING"
    opening_balance: 6400.00
    currency_code: EUR
  - name: "UK Current Account"
    type: checking
    source_type: csv
    institution: "Barclays"
    opening_balance: 2900.00
    currency_code: GBP
  - name: "Canada Checking"
    type: checking
    source_type: ofx
    institution: "RBC Royal Bank"
    opening_balance: 5100.00
    currency_code: CAD
  - name: "UAE Checking"
    type: checking
    source_type: csv
    institution: "Emirates NBD"
    opening_balance: 18500.00
    currency_code: AED
  - name: "US Checking"
    type: checking
    source_type: ofx
    institution: "Chase Bank"
    opening_balance: 3800.00

# Every account that spends has a funding source. Cross-currency transfers move
# only their explicit sent and received amounts, so an account without income or
# an inbound transfer can still drift thousands below zero — not a position any
# demo should show.
income:
  - type: salary
    account: "Eurozone Checking"
    amount: 4600.00
    schedule: monthly
    annual_raise_pct: 2.5
    description_template: "SALARIS {employer}"
    employer: "Meridian Analytics BV"
  - type: freelance
    account: "UK Current Account"
    amount: 560.00
    schedule: monthly
    annual_raise_pct: 2.0
    description_template: "FASTER PAYMENT {employer}"
    employer: "Thames Ridge Consulting Ltd"
  - type: freelance
    account: "Canada Checking"
    amount: 800.00
    schedule: monthly
    annual_raise_pct: 2.0
    description_template: "EFT DEPOSIT {employer}"
    employer: "Maple Line Advisory Inc"
  - type: freelance
    account: "UAE Checking"
    amount: 2400.00
    schedule: monthly
    annual_raise_pct: 2.0
    description_template: "SALARY TRANSFER {employer}"
    employer: "Gulf Data Partners FZ LLC"
  - type: freelance
    account: "US Checking"
    amount: 320.00
    schedule: monthly
    annual_raise_pct: 2.0
    description_template: "ACH CREDIT {employer}"
    employer: "Redwood Editorial LLC"

# The earlier USD acquisition fixes a $100 basis for 90 EUR. The later partial
# disposal returns $55 for 45 EUR, realizing exactly $5 under FIFO each month.
transfers:
  - from: "US Checking"
    to: "Eurozone Checking"
    amount: 100.00
    received_amount: 90.00
    schedule: monthly
    day_of_month: 5
    description_template: "USD TO EUR"
  - from: "Eurozone Checking"
    to: "US Checking"
    amount: 45.00
    received_amount: 55.00
    schedule: monthly
    day_of_month: 20
    description_template: "EUR TO USD"

recurring:
  - category: housing
    description: "Huur Amsterdam"
    account: "Eurozone Checking"
    amount: 1750.00
    day_of_month: 1
  - category: utilities
    description: "Eneco Energie"
    account: "Eurozone Checking"
    amount: { mean: 118.00, stddev: 32.00 }
    day_of_month: 14
  - category: subscriptions
    description: "Mobile Plan UK"
    account: "UK Current Account"
    amount: 22.00
    day_of_month: 8
  - category: insurance
    description: "Motor Insurance Dubai"
    account: "UAE Checking"
    amount: 385.00
    day_of_month: 6
  - category: utilities
    description: "Rogers Internet"
    account: "Canada Checking"
    amount: 94.00
    day_of_month: 19

