repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff
        language: system
        types: [python]
        args: [check, --fix]
        require_serial: false
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff
        language: system
        # python + markdown: with `preview = true` ruff formats Python code
        # blocks inside .md too, and CI runs `ruff format --check .` over both.
        # A python-only scope here let an unformatted markdown code block slip
        # past pre-commit and fail CI. (`ruff check` is a no-op on .md, so the
        # check hook above stays python-only.)
        types_or: [python, markdown]
        args: [format]
        require_serial: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Claude Code denies in-place writes under .claude/ and to .mcp.json.
      # end-of-file-fixer opens every file rb+ before checking whether a fix is
      # needed, so it fails there unconditionally; trailing-whitespace opens
      # read-only first and fails only when it would rewrite. Both are excluded
      # so a commit touching agent config never needs a sandbox bypass.
      - id: trailing-whitespace
        exclude: '^(\.claude/|\.mcp\.json$)'
      - id: end-of-file-fixer
        exclude: '^(\.claude/|\.mcp\.json$)'
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
        exclude: '\.(png|jpg|jpeg|gif|ico|svg)$'
      - id: check-merge-conflict
      - id: debug-statements
